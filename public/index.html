<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account Quest CRM</title>
<style>
  :root { --bg:#f5f3ee; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e1d8; --accent:#0f766e; --accent2:#e6f4f2;
          --green:#15803d; --amber:#b45309; --red:#b91c1c; --greenbg:#dcfce7; --amberbg:#fef3c7; --redbg:#fee2e2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, Roboto, sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 20px 60px; }
  header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header .wrap { display:flex; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; margin-right:auto; }
  .status { font-size:13px; color:var(--muted); background:#f3f4f6; padding:4px 10px; border-radius:20px; }
  button { font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 14px; border-radius:8px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  .linkbtn { border:none; background:none; padding:0; color:var(--accent); text-decoration:underline dotted; cursor:pointer; font-size:inherit; }

  .banner { background:#fff7d6; border:1px solid #f1d27a; border-radius:12px; padding:12px 16px; margin-top:16px; display:none; }
  .banner.show { display:block; animation:pop .4s ease; }
  @keyframes pop { from { transform:scale(.98); opacity:.3 } to { transform:none; opacity:1 } }

  .tabs { display:flex; gap:10px; margin:20px 0 16px; flex-wrap:wrap; }
  .tab { flex:1; min-width:260px; text-align:left; padding:12px 16px; border-radius:12px; border:2px solid var(--line); background:#fff; }
  .tab.on { border-color:var(--accent); background:var(--accent2); }
  .tab b { display:block; font-size:16px; } .tab span { font-size:13px; color:var(--muted); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
  .card h2 { font-size:17px; margin:0 0 10px; }
  .headline { font-size:18px; font-weight:600; margin:6px 0 14px; }
  .badge { display:inline-block; padding:2px 12px; border-radius:20px; font-size:13px; font-weight:600; }
  .badge.Green{background:var(--greenbg);color:var(--green)} .badge.Amber{background:var(--amberbg);color:var(--amber)} .badge.Red{background:var(--redbg);color:var(--red)}
  .nums { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  .num { background:#faf9f6; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .num small { display:block; color:var(--muted); font-size:12px; }
  .num b { font-size:16px; }
  .num .linkbtn { font-size:12px; }

  .answer { border-top:1px solid var(--line); padding:12px 0; }
  .answer:first-of-type { border-top:none; }
  .answer h3 { font-size:15px; margin:0 0 4px; color:var(--accent); }
  .answer .src { font-size:12px; color:var(--muted); margin-top:4px; }
  ul.clean { margin:4px 0 0; padding-left:20px; } ul.clean li { margin:3px 0; }
  .reason { display:flex; gap:10px; padding:4px 0; }
  .reason .pts { min-width:42px; text-align:right; font-weight:700; color:var(--red); }
  .vs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
  .vs div { border-radius:10px; padding:10px 12px; } .vs .said { background:#f3f4f6; } .vs .real { background:var(--redbg); }
  .vs small { display:block; font-weight:600; font-size:12px; color:var(--muted); }
  @media (max-width:700px){ .vs { grid-template-columns:1fr; } }

  details.sec { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  details.sec > summary { cursor:pointer; padding:14px 20px; font-weight:600; list-style:none; display:flex; align-items:center; gap:8px; }
  details.sec > summary::-webkit-details-marker { display:none; }
  details.sec > summary::before { content:"▸"; color:var(--accent); transition:transform .15s; }
  details.sec[open] > summary::before { transform:rotate(90deg); }
  details.sec > summary .count { margin-left:auto; font-weight:400; color:var(--muted); font-size:13px; }
  details.sec .body { padding:0 20px 16px; }
  .item { border-top:1px solid var(--line); padding:10px 0; } .item:first-child { border-top:none; }
  .meta { font-size:13px; color:var(--muted); }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; margin-left:6px; background:#f3f4f6; }
  .tag.claim{background:var(--amberbg);color:var(--amber)} .tag.told{background:#e0f2fe;color:#075985} .tag.verified{background:var(--greenbg);color:var(--green)}
  .tag.risk{background:var(--redbg);color:var(--red)} .tag.task{background:#e0f2fe;color:#075985} .tag.next_step{background:var(--greenbg);color:var(--green)}
  .tag.new{background:#fde68a;color:#7c2d12;font-weight:700}

  table.t { width:100%; border-collapse:collapse; font-size:13px; }
  table.t th, table.t td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  table.t th { color:var(--muted); font-weight:600; }
  .st-regular{color:var(--green);font-weight:600} .st-stopped{color:var(--red);font-weight:700} .st-never{color:var(--red)} .st-idle{color:var(--amber)} .st-maint{color:#6d28d9}

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:flex-start; justify-content:center; z-index:20; overflow:auto; padding:40px 16px; }
  .modal.show { display:flex; }
  .modal .box { background:#fff; border-radius:14px; max-width:820px; width:100%; padding:20px 22px; }
  .modal h2 { margin:0 0 6px; font-size:18px; }
  pre { background:#f7f6f2; padding:10px; border-radius:8px; overflow:auto; max-height:280px; font-size:12px; white-space:pre-wrap; word-break:break-word; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 3px; }
  input, select, textarea { width:100%; font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  textarea { min-height:70px; }
  .muted { color:var(--muted); font-size:13px; } .empty { color:var(--muted); font-style:italic; }
  .log div { font-size:13px; padding:2px 0; } .ok{color:var(--green)} .err{color:var(--red)}
  .ids { margin-top:4px; } .ids code, td code { font-size:11px; background:#eef2f7; color:#334155; padding:1px 6px; border-radius:6px; margin-right:3px; display:inline-block; }
  table.ans td { vertical-align:top; } tr.calc td { background:#fff7d6; }
  .apart { margin-top:10px; background:#f8f6f1; border:1px dashed var(--line); border-radius:10px; padding:8px 12px; }
  .powercard { border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:8px; } .powercard h4 { margin:2px 0 6px; font-size:14px; }
  td.k { color:var(--muted); width:150px; white-space:nowrap; }

  .filter { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; }
  nav.views { display:flex; gap:6px; flex-wrap:wrap; margin:18px 0 6px; }
  nav.views button { border-radius:20px; padding:7px 16px; font-weight:600; }
  nav.views button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:800px){ .grid2 { grid-template-columns:1fr; } }
  .kpi { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0; }
  .kpi div { background:#faf9f6; border:1px solid var(--line); border-radius:10px; padding:8px 10px; } .kpi small { display:block; color:var(--muted); font-size:12px; } .kpi b { font-size:17px; }
  .bottom { background:#f0fdfa; border-left:4px solid var(--accent); padding:10px 14px; border-radius:8px; margin:6px 0 2px; }
  .acct { font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:1px 7px; white-space:nowrap; }
  .acct.B { background:#7c3aed; }
  .chart { width:100%; height:auto; } .chart text { font:11px Segoe UI,system-ui,sans-serif; fill:#6b7280; }
  .legend span { display:inline-block; margin-right:14px; font-size:12px; color:var(--muted); } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .ids { display:none; } body.src .ids { display:block; }
  .switch { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; } .switch input { width:auto; }
  @media print { header button, nav.views, .switch, details.sec, .banner { display:none !important; } .view { display:block !important; page-break-after:always; } body { background:#fff; } .card { break-inside:avoid; } }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Account Quest CRM <span class="meta" style="font-weight:400">· FlytBase key accounts</span></h1>
  <label class="switch"><input type="checkbox" id="srcToggle" onchange="document.body.classList.toggle('src', this.checked)"> Show sources</label>
  <span class="status" id="status">Loading…</span>
  <button onclick="window.print()">Print / PDF</button>
</div></header>
<div class="wrap">
  <div class="banner" id="banner"></div>
  <nav class="views" id="nav"></nav>
  <div id="main"><div class="card">Loading the accounts…</div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<script>
let S = null, U = null, view = "overview", current = "B", clientF = "all", openState = {}, seenEvents = null;
let ADMIN = ""; try { const k = new URLSearchParams(location.search).get("key"); if (k) localStorage.setItem("aqKey", k); ADMIN = localStorage.getItem("aqKey") || ""; } catch {}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const ago = (iso) => { if (!iso) return "never"; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }) : "";
const money = (v, cur) => (cur === "GBP" ? "£" : "€") + Math.round(v).toLocaleString("en-GB");
const chips = (ids) => (ids && ids.length ? `<div class="ids">${ids.map((i) => `<code>${esc(i)}</code>`).join(" ")}</div>` : "");
const tag = (a) => `<span class="acct ${a.id}">${a.id === "A" ? "Police" : "Industrial"}</span>`;
const kindLabel = { risk:"Risk", task:"Task", next_step:"Next step", note:"Note" };
const statusLabel = { claim:"Claim – not checked", told:"Told to us", verified:"Checked ✓" };
const A = () => S.accounts.find((a) => a.id === current);
const atRisk = (a) => { const f = a.fleet, r = a.renewal; const per = r.value / f.total, idle = f.total - f.flyingNow; return { per, idle, value: per * idle }; };
function sec(key, title, count, inner, open) { const o = openState[key] ?? open;
  return `<details class="sec" data-key="${key}" ${o ? "open" : ""}><summary>${title}<span class="count">${count ?? ""}</span></summary><div class="body">${inner}</div></details>`; }
const filterBar = () => `<div class="filter">${[["all","Both clients"], ...S.accounts.map((a) => [a.id, a.name])].map(([k, t]) => `<button class="${clientF === k ? "primary" : ""}" onclick="clientF='${k}';render()">${esc(t)}</button>`).join("")}</div>`;
const pickAcc = () => S.accounts.filter((a) => clientF === "all" || a.id === clientF);
const VIEWS = [["overview","Overview"],["risks","Risks"],["opps","Opportunities"],["usage","Drone usage"],["detail","Account detail"]];

// ---------- Overview ----------
function overview() {
  return `<div class="grid2">${S.accounts.map((a) => { const r = atRisk(a), q = a.answers;
    return `<div class="card"><h2>${tag(a)} ${esc(a.name)} <span class="badge ${a.health.rating}">${a.health.rating}</span></h2>
      <div class="bottom">${esc(a.brief?.headline || "")}</div>
      <div class="kpi"><div><small>Contract</small><b>${esc(a.renewal.label)}</b></div><div><small>Renewal</small><b>${fmtDate(a.renewal.date)}</b><br><span class="meta">${a.renewal.daysLeft} days · not automatic</span></div>
      <div><small>Docks flying regularly now</small><b>${a.fleet.flyingNow} of ${a.fleet.total}</b> <button class="linkbtn" onclick="current='${a.id}';trace('fleet')">trace</button></div><div><small>Renewal value at risk</small><b>${money(r.value, a.renewal.currency)}</b><br><span class="meta">${r.idle} idle docks × ${money(r.per, a.renewal.currency)}</span></div></div>
      <b>Top risks</b><ul class="clean">${q.wrong.slice(0, 3).map((w) => `<li>${esc(w.what)}</li>`).join("")}</ul>
      <b style="display:block;margin-top:8px">First move</b><div>${esc(q.first[0].move)} <span class="meta">– ${esc(q.first[0].owner)}, by ${esc(q.first[0].by)}</span></div>
      <div style="margin-top:10px"><button class="small" onclick="current='${a.id}';go('detail')">Open account detail →</button></div></div>`; }).join("")}</div>
    <div class="card meta">Health = risk points from warning signs in the game data (under 20 Green, 20–49 Amber, 50+ Red). Renewal value at risk = contract value per dock × docks not flying regularly in the last 2 weeks.</div>`;
}
// ---------- Risks ----------
function risks() {
  const rows = pickAcc().flatMap((a) => a.answers.wrong.map((w) => ({ a, ...w })));
  const order = ["Deadline at risk","Deal turning bad","Person leaving","Going cold","Stuck"];
  rows.sort((x, y) => order.indexOf(x.type) - order.indexOf(y.type));
  return filterBar() + `<div class="card"><h2>${clientF === "all" ? "Risks across both clients" : "Risks – " + esc(pickAcc()[0].name)} <span class="meta">(${rows.length})</span></h2><table class="t ans"><tr><th>Account</th><th>Risk</th><th>When it turns bad</th></tr>
    ${rows.map((x) => `<tr><td>${tag(x.a)}</td><td><span class="tag risk">${esc(x.type)}</span> ${esc(x.what)}${chips(x.ids)}</td><td>${esc(x.turnsBad)}</td></tr>`).join("")}</table></div>
    <div class="${clientF === "all" ? "grid2" : ""}">${pickAcc().map((a) => `<div class="card"><h2>${tag(a)} What we do first</h2><table class="t ans"><tr><th>#</th><th>Move</th><th>Owner · by</th></tr>
      ${a.answers.first.map((m) => `<tr><td><b>${m.rank}</b></td><td>${esc(m.move)}${chips(m.ids)}</td><td>${esc(m.owner)}<br><b>${esc(m.by)}</b></td></tr>`).join("")}</table></div>`).join("")}</div>`;
}
// ---------- Opportunities ----------
function opps() {
  return filterBar() + pickAcc().map((a) => { const w = a.answers.worth, r = atRisk(a);
    return `<div class="card"><h2>${tag(a)} ${esc(a.name)}</h2><table class="t ans"><tr><th>Opportunity</th><th>Value</th><th>Confidence</th><th>Basis</th></tr>
      ${w.backed.map((d) => `<tr><td><b>${esc(d.deal)}</b></td><td><b>${esc(d.value)}</b></td><td><span class="tag verified">Backed</span></td><td>${esc(d.basis)}${chips(d.ids)}</td></tr>`).join("")}
      <tr class="calc"><td><b>Protect the renewal</b></td><td><b>${money(r.value, a.renewal.currency)} at risk</b></td><td><span class="tag risk">At risk now</span></td><td>${r.idle} of ${a.fleet.total} docks not flying regularly × ${money(r.per, a.renewal.currency)} a dock. Live from usage data.</td></tr>
      ${w.unbacked.map((u) => `<tr><td>${esc(u.item)}</td><td>–</td><td><span class="tag claim">Unverified</span></td><td>${esc(u.why)}${chips(u.ids)}</td></tr>`).join("")}</table></div>`; }).join("")
    + `<div class="card meta">Backed = value from the contract or an offer on file. Unverified = rests on one person's word; not counted until checked.</div>`;
}
// ---------- Drone usage ----------
function chart(weeks) {
  const W = 900, H = 220, P = 34, n = weeks.length, max = Math.max(1, ...weeks.map((w) => w.flights)), dmax = Math.max(1, ...weeks.map((w) => w.docks));
  const bw = (W - P * 2) / n;
  const bars = weeks.map((w, i) => `<rect x="${P + i * bw + 2}" y="${H - P - (w.flights / max) * (H - P * 2)}" width="${bw - 4}" height="${(w.flights / max) * (H - P * 2)}" fill="#99d5cf"><title>${w.week}: ${w.flights} flights</title></rect>`).join("");
  const line = weeks.map((w, i) => `${P + i * bw + bw / 2},${H - P - (w.docksRegular / dmax) * (H - P * 2)}`).join(" ");
  const labels = weeks.map((w, i) => (i % Math.ceil(n / 8) === 0 ? `<text x="${P + i * bw + bw / 2}" y="${H - 12}" text-anchor="middle">${new Date(w.week).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>` : "")).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bars}<polyline points="${line}" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="${P}" y="14">${max} flights</text><text x="${W - P}" y="14" text-anchor="end" fill="#b91c1c">${dmax} docks</text>${labels}</svg>
    <div class="legend"><span><i style="background:#99d5cf"></i>Flights per week</span><span><i style="background:#b91c1c"></i>Docks flying regularly (2+ flights that week)</span></div>`;
}
function usage() {
  if (!U) return `<div class="card">Loading usage…</div>`;
  return S.accounts.map((a) => { const wk = U[a.id].weeks.slice(-16), l4 = wk.slice(-4), p4 = wk.slice(-8, -4);
    const sum = (x) => x.reduce((t, w) => t + w.flights, 0), now = sum(l4), before = sum(p4), ch = before ? Math.round((now - before) / before * 100) : 0;
    return `<div class="card"><h2>${tag(a)} ${esc(a.name)} – drone usage</h2>
      <div class="kpi" style="grid-template-columns:repeat(4,1fr)"><div><small>Flights, last 4 weeks</small><b>${now}</b></div><div><small>vs previous 4 weeks</small><b style="color:${ch < 0 ? "var(--red)" : "var(--green)"}">${ch > 0 ? "+" : ""}${ch}%</b></div>
      <div><small>Docks flying regularly now</small><b>${a.fleet.flyingNow} of ${a.fleet.total}</b></div><div><small>Never flown</small><b>${a.fleet.never}</b></div></div>
      ${chart(wk)}<div class="meta">Last 16 weeks on file (to week of ${fmtDate(wk[wk.length - 1]?.week)}). <button class="linkbtn" onclick="current='${a.id}';trace('fleet')">See every dock</button>${chips([U[a.id].source])}</div></div>`; }).join("");
}
function fiveAnswers(a) {
  const q = a.answers; if (!q) return [];
  const f = a.fleet, r = a.renewal;
  const perDock = r && f.total ? r.value / f.total : 0, idle = f.total - f.flyingNow;
  const atRisk = `<tr class="calc"><td><b>Renewal value at risk now</b><br><span class="meta">calculated live</span></td><td><b>${money(perDock * idle, r?.currency)}</b></td>
    <td>${idle} of ${f.total} docks are not flying regularly right now × ${money(perDock, r?.currency)} a dock (${money(r?.value || 0, r?.currency)} ÷ ${f.total} docks). <button class="linkbtn" onclick="trace('fleet')">trace</button>${chips([f.evidence.split(" + ")[0], "contract.txt"])}</td></tr>`;
  const w = q.worth;
  const tblWorth = `<table class="t ans"><tr><th>Deal</th><th>Value</th><th>Backed by</th></tr>
    ${w.backed.map((d) => `<tr><td><b>${esc(d.deal)}</b></td><td><b>${esc(d.value)}</b></td><td>${esc(d.basis)}${chips(d.ids)}</td></tr>`).join("")}${atRisk}</table>
    <div class="apart"><b>Shown apart – cannot be backed:</b>${w.unbacked.map((u) => `<div class="item"><b>${esc(u.item)}</b> – ${esc(u.why)}${chips(u.ids)}</div>`).join("")}</div>`;
  const tblPower = q.power.map((p) => `<div class="powercard"><h4>${esc(p.deal)}</h4>
    <table class="t"><tr><td class="k">Decides</td><td>${esc(p.decides)}</td></tr><tr><td class="k">Pays</td><td>${esc(p.pays)}</td></tr>
    <tr><td class="k">Uses it</td><td>${esc(p.uses)}</td></tr><tr><td class="k">Could block it</td><td>${esc(p.blocks)}</td></tr>
    <tr><td class="k">Where each stands</td><td>${p.stance.map(([n, t]) => `<b>${esc(n)}</b>: ${esc(t)}`).join("<br>")}</td></tr></table>${chips(p.ids)}</div>`).join("");
  const tblFirst = `<table class="t ans"><tr><th>#</th><th>Move</th><th>Owner</th><th>By</th><th>Deal it moves</th></tr>
    ${q.first.map((m) => `<tr><td><b>${m.rank}</b></td><td>${esc(m.move)}${chips(m.ids)}</td><td>${esc(m.owner)}</td><td><b>${esc(m.by)}</b></td><td><code>${esc(m.deal)}</code></td></tr>`).join("")}</table>`;
  const tblWrong = `<table class="t ans"><tr><th>What</th><th>When it turns bad</th></tr>
    ${q.wrong.map((x) => `<tr><td><span class="tag risk">${esc(x.type)}</span> ${esc(x.what)}${chips(x.ids)}</td><td>${esc(x.turnsBad)}</td></tr>`).join("")}</table>
    <div class="meta" style="margin-top:6px">Health score: <span class="badge ${a.health.rating}">${a.health.rating} · ${a.health.score} risk points</span> – ${a.health.reasons.map((x) => `+${x.points} ${esc(x.text)}`).join("; ")}</div>`;
  const tblUnknown = `<table class="t ans"><tr><th>What we do not know</th><th>Why it matters</th><th>Who could fill it</th></tr>
    ${q.unknown.map((u) => `<tr><td><b>${esc(u.gap)}</b>${chips(u.ids)}</td><td>${esc(u.why)}</td><td>${esc(u.who)}</td></tr>`).join("")}</table>`;
  return [
    { q: "1. What is the book worth?", a: tblWorth, src: "Values come from the contract and the game's offers. Anything resting on one person's word is listed apart, not added in." },
    { q: "2. Who holds the power?", a: tblPower, src: "Stakeholders and their stance from get_my_accounts, plus calls, contract and logins." },
    { q: "3. What do you do first?", a: tblFirst, src: "Ranked by the nearest deadline it protects." },
    { q: "4. What is about to go wrong?", a: tblWrong, src: "Deadlines, people going cold and stuck items, from events, tickets, emails and usage. The health score adds the warning signs up." },
    { q: "5. What do you still not know?", a: tblUnknown, src: "Gaps the plan rests on, from profile.json (not on file) and unchecked claims." },
  ];
}


// ---------- Account detail ----------
function detail() {
  const a = A(), f = a.fleet, h = a.health;
  let html = `<div style="display:flex;gap:8px;margin:6px 0 12px">${S.accounts.map((x) => `<button class="${x.id === current ? "primary" : ""}" onclick="current='${x.id}';render()">${esc(x.name)}</button>`).join("")}</div>`;
  html += `<div class="card"><h2>${tag(a)} ${esc(a.name)} <span class="badge ${h.rating}">${h.rating} · ${h.score} risk points</span></h2><div class="headline">${esc(a.brief?.headline || "")}</div>
    <div class="nums"><div class="num"><small>Contract</small><b>${esc(a.renewal.label)}</b><br><button class="linkbtn" onclick="trace('renewal')">where from?</button></div>
    <div class="num"><small>Renewal</small><b>${fmtDate(a.renewal.date)}</b><br><span class="meta">${a.renewal.daysLeft} days · not automatic</span></div>
    <div class="num"><small>Docks flying regularly now</small><b>${f.flyingNow} of ${f.total}</b><br><button class="linkbtn" onclick="trace('fleet')">trace this number</button></div>
    <div class="num"><small>Open requests nobody owns</small><b>${a.openRequests.length}</b><br><button class="linkbtn" onclick="trace('requests')">see them</button></div></div></div>`;
  html += `<div class="card"><h2>The five answers</h2>${fiveAnswers(a).map((x) => `<div class="answer"><h3>${x.q}</h3>${x.a}<div class="src">How it decides: ${esc(x.src)}</div></div>`).join("")}</div>`;
  const newIds = new Set((S.newEvents || []).map((e) => e.id));
  html += sec("events", "🔔 Events since you took over", a.events.length, a.events.map((e) => `<div class="item"><b>${esc(e.title)}</b>${newIds.has(e.id) ? '<span class="tag new">NEW</span>' : ""} <span class="meta">· ${fmtDate(e.dated)}</span><br>${esc(e.summary)}
    ${e.records?.length ? `<details><summary class="meta" style="cursor:pointer">Original email / data</summary>${e.records.map((r) => `<pre>${esc(r.text)}</pre>`).join("")}</details>` : ""}</div>`).join("") || '<div class="empty">Nothing yet.</div>', false);
  const sent = S.notesSent.filter((n) => n.account === current).map((n) => n.title), queued = S.noteQueue.filter((n) => n.account === current).map((n) => n.title);
  html += sec("notes", "📝 Notes for the judges", `${sent.length} sent`, a.drafts.map((d, i) => {
    const st = sent.includes(d.title) ? `<span class="meta ok">✓ sent</span>` : queued.includes(d.title) ? `<span class="meta">⏳ queued</span>` : ADMIN ? `<button class="small primary" onclick="sendDraft(${i})">Send</button>` : "";
    return `<div class="item" style="display:flex;gap:12px"><div style="flex:1"><b>${esc(d.title)}</b><span class="tag ${d.kind}">${kindLabel[d.kind]}</span><br>${esc(d.text)}</div>${st}</div>`; }).join("")
    + (ADMIN ? `<div class="item"><b>Write your own</b><div style="display:grid;grid-template-columns:160px 1fr;gap:8px"><select id="nKind"><option value="next_step">Next step</option><option value="risk">Risk</option><option value="task">Task</option><option value="note">Note</option></select><input id="nTitle" placeholder="Short title"></div><textarea id="nText" placeholder="What, who, by when, and the evidence" style="margin-top:6px"></textarea><button class="primary" style="margin-top:6px" onclick="sendOwn()">Queue note</button></div>` : `<div class="meta">Read-only view. The owner sends notes with a private key.</div>`), false);
  html += sec("facts", "💬 What people told us", a.facts.length, a.facts.map((x) => `<div class="item">"${esc(x.text)}"<span class="tag ${x.status}">${statusLabel[x.status] || x.status}</span><br><span class="meta">${esc(x.said_by)}</span></div>`).join(""), false);
  html += sec("tech", "⚙️ Behind the scenes", "", `<div class="meta">Game date ${fmtDate(S.gameDate)} · storage: ${esc(S.storage)} · accounts fetched ${ago(S.dataAsOf.accounts)} · events checked ${ago(S.dataAsOf.signals)}</div>
    <div class="log" style="margin-top:8px">${S.log.map((l) => `<div><span class="${l.ok ? "ok" : "err"}">${l.ok ? "✓" : "✗"}</span> ${esc(l.call)} <span class="meta">${ago(l.at)}</span>${l.error ? ` <span class="err">${esc(l.error)}</span>` : ""}</div>`).join("") || '<div class="empty">No calls yet</div>'}</div>`, false);
  return html;
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  document.getElementById("nav").innerHTML = VIEWS.map(([k, t]) => `<button class="${k === view ? "on" : ""}" onclick="go('${k}')">${t}</button>`).join("");
  const html = { overview, risks, opps, usage, detail }[view]();
  document.getElementById("main").innerHTML = html;
  document.querySelectorAll("details.sec").forEach((d) => d.addEventListener("toggle", () => (openState[d.dataset.key] = d.open)));
}
// ---------- tracing a number back to its source ----------
function trace(what) {
  const a = A(); let h = "";
  if (what === "fleet") {
    const f = a.fleet;
    const cls = (d) => d.stopped ? "st-stopped" : d.status === "regular" ? "st-regular" : d.status === "never flown" ? "st-never" : d.status === "in maintenance" ? "st-maint" : "st-idle";
    h = `<h2>Docks flying regularly now: ${f.flyingNow} of ${f.total}</h2>
      <p class="muted"><b>Source:</b> ${esc(f.evidence)} · ${esc(f.window)}<br><b>Rule:</b> ${esc(f.rule)}</p>
      <p>Regular ${f.regular} · Occasional ${f.occasional} · Idle ${f.idle} · Never flown ${f.never} · In maintenance ${f.maintenance} · <span class="st-stopped">Stopped ${f.stopped.length}</span></p>
      <table class="t"><tr><th>Dock</th><th>Flights, 4 weeks before</th><th>Flights, last 4 weeks</th><th>Last 2 weeks</th><th>Flying now?</th><th>Status</th></tr>
      ${f.perDock.map((d) => `<tr><td>${d.dock}</td><td>${d.before}</td><td>${d.recent}</td><td>${d.lastTwo}</td><td>${d.flyingNow ? "Yes" : "No"}</td><td class="${cls(d)}">${d.stopped ? "STOPPED" : d.status}</td></tr>`).join("")}</table>`;
  } else if (what === "renewal") {
    h = `<h2>Contract and renewal</h2><p><b>${esc(a.renewal.label)}</b>, term ends <b>${fmtDate(a.renewal.date)}</b> (${a.renewal.daysLeft} days from the game date). No automatic renewal.</p><p class="muted">Source: ${esc(a.renewal.evidence)}</p>`;
  } else if (what === "requests") {
    h = `<h2>Open requests nobody owns: ${a.openRequests.length}</h2><p class="muted">Source: requests.csv (plus rows added by new events). Rule: status Open and the owner column is empty.</p>
      <table class="t"><tr><th>Request</th><th>Opened</th><th>Days open</th><th>From</th><th>What</th></tr>${a.openRequests.map((r) => `<tr><td>${esc(r.id)}</td><td>${esc(r.opened)}</td><td>${r.age}</td><td>${esc(r.from)}</td><td>${esc(r.summary)}</td></tr>`).join("")}</table>`;
  }
  document.getElementById("modalBox").innerHTML = h + `<div style="margin-top:14px;text-align:right"><button onclick="closeModal()">Close</button></div>`;
  document.getElementById("modal").classList.add("show");
}
function closeModal() { document.getElementById("modal").classList.remove("show"); }

// ---------- notes (owner only) ----------
async function postNote(n) {
  const r = await fetch("/api/note", { method: "POST", headers: { "content-type": "application/json", "x-admin-key": ADMIN }, body: JSON.stringify(n) });
  if (!r.ok) alert((await r.json()).error);
}
async function sendDraft(i) { const d = A().drafts[i]; await postNote({ account: current, kind: d.kind, title: d.title, text: d.text }); load(); }
async function sendOwn() {
  const text = document.getElementById("nText").value.trim(); if (!text) return alert("Write the note first.");
  await postNote({ account: current, kind: document.getElementById("nKind").value, title: document.getElementById("nTitle").value.trim(), text }); load();
}

// ---------- live updates ----------
function showNew(events) {
  const all = S.accounts.flatMap((a) => a.events.map((e) => ({ ...e, acc: a.name })));
  const el = document.getElementById("banner");
  el.innerHTML = `<b>🔔 New event picked up:</b> ${all.filter((e) => events.includes(e.id)).map((e) => `${esc(e.acc)} – ${esc(e.title)}`).join("; ")}. The numbers have been recalculated.`;
  el.classList.add("show");
}
async function load() {
  [S, U] = await Promise.all([fetch("/api/state").then((r) => r.json()), fetch("/api/usage").then((r) => r.json()).catch(() => null)]);
  const ids = S.accounts.flatMap((a) => a.events.map((e) => e.id));
  if (seenEvents && ids.some((id) => !seenEvents.has(id))) showNew(ids.filter((id) => !seenEvents.has(id)));
  seenEvents = new Set(ids);
  document.getElementById("status").textContent = `Live · checked ${ago(S.dataAsOf.signals)}`;
  const busy = document.activeElement?.matches("input:not([type=checkbox]), textarea, select") || document.getElementById("modal").classList.contains("show");
  if (!busy) render();
}
async function tick() { try { await fetch("/api/refresh"); } catch {} await load(); }
load().then(tick); setInterval(tick, 20000);
</script>
